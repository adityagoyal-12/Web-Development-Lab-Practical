
<!DOCTYPE html>
<html>
<head>
    <title>Student Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header>
        <h1>Student Expense Tracker</h1>
        <p>Manage your daily expenses smartly!</p>
    </header>

    <div class="total-box">
        <h2>Total Expenses</h2>
        <h1 id="totalAmount">₹0</h1>
    </div>

    <div class="expense-form">
        <h2>Add New Expense</h2>

        <form id="expenseForm">

            <div class="input-group">
                <label>Expense Name</label>
                <input type="text" id="expenseName" required>
            </div>

            <div class="input-group">
                <label>Amount (₹)</label>
                <input type="number" id="expenseAmount" min="0.01" step="0.01" required>
            </div>

            <div class="input-group">
                <label>Category</label>
                <select id="expenseCategory" required>
                    <option value="">Select Category</option>
                    <option>Food</option>
                    <option>Travel</option>
                    <option>Shopping</option>
                    <option>Education</option>
                    <option>Other</option>
                </select>
            </div>

            <button type="submit">Add Expense</button>

        </form>
    </div>

    <div class="expense-list-section">
        <h2>My Expenses</h2>

        <label>Filter by Category:</label>

        <select id="categoryFilter">
            <option>All</option>
            <option>Food</option>
            <option>Travel</option>
            <option>Shopping</option>
            <option>Education</option>
            <option>Other</option>
        </select>

        <div id="expenseList">
            <p id="emptyMessage">No expenses added yet!</p>
        </div>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
